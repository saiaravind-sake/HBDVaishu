<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Vaishu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 100;        
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.75), rgba(0,0,0,0.9));
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 7rem;
            line-height: 1;
            animation: glow 4s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 40px #ec4899; }
            to { text-shadow: 0 0 70px #db2777, 0 0 110px #f472b6; }
        }

        .name {
            font-size: 5.8rem;
            background: linear-gradient(to right, #fce7f3, #f9a8d4, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: -15px;
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video id="bgVideo" class="bg-video" autoplay loop playsinline muted>
        <source src="assets/videos/birthday-bg.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="content">
        <h1 class="title">Happy Birthday</h1>
        <h1 class="name">Vaishu</h1>
        <p style="font-size: 2.3rem; margin-top: 30px; color: #fbcfe8;"> 
             Happy 26 to the one who is </br>
Intelligence^22, Attitude^1, Humor^9, Charisma^19, Vibrancy^8, Integrity^21 =
Total Beauty^80.
Not just in numbers, but in every way… you are truly special.
Many more happy returns of the day, Vaishu ❤️.       </p>
    </div>

    <script>
        const video = document.getElementById('bgVideo');

        // Try to play with sound automatically
        window.addEventListener('load', () => {
            video.muted = false;
            video.play().catch(() => {
                console.log("Autoplay blocked - waiting for interaction");
            });
        });

        // Fallback: If autoplay blocked, unmute on first interaction
        document.addEventListener('click', () => {
            video.muted = false;
            video.play().catch(() => {});
        }, { once: true });
    </script>
</body>
</html>
